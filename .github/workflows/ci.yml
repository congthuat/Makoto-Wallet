name: Makoto Wallet CI

on:
  push:
    branches: [makoto-wallet]
  pull_request:
    branches: [makoto-wallet]
  workflow_dispatch:
    inputs:
      sqlite_diagnostics:
        description: Run the isolated legacy SQLite locking negative control
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      # Frontend suites import backend modules with their own dependencies.
      - name: Install backend dependencies for frontend tests
        run: npm ci --prefix backend

      - name: Brain tests
        run: npm run test:brain --prefix frontend

      - name: Agent tests
        run: npm run test:agent --prefix frontend

      - name: Send handoff browser regressions (mock wallet)
        run: npm run test:send --prefix frontend

      - name: Swap and CCTP completion browser regressions (mock transactions)
        run: npm run test:completion --prefix frontend

      - name: Tasks/auth tests
        run: npm run test:tasks --prefix frontend

      - name: Portfolio tests
        run: npm run test:portfolio --prefix frontend

      - name: UX tests
        run: npm run test:ux --prefix frontend

      - name: Migration tests
        run: npm run test:migration --prefix frontend

      - name: UI tests
        run: npm run test:ui --prefix frontend

      - name: Polish tests
        run: npm run test:polish --prefix frontend

      - name: Feedback and Receive share regressions
        run: npm run test:sharing --prefix frontend

      - name: TypeScript check
        run: npm run type-check --prefix frontend

      - name: ESLint
        run: npm run lint --prefix frontend

      - name: Production build
        env:
          BACKEND_PORT: "3001"
          BASE_PATH: ""
        run: npm run build --prefix frontend

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Backend tests
        run: npm test --prefix backend

      - name: Repeat auth restart and concurrency regressions (20 runs)
        run: npm run test:auth:repeat --prefix backend

      - name: Repeat full backend suite (2 additional runs)
        run: |
          for attempt in 1 2; do
            npm test --prefix backend
          done

      # Diagnostic-only legacy library, never loaded by the application. All
      # probe databases and this installation live in disposable temp paths.
      - name: Diagnose legacy SQLite locking
        if: github.event_name == 'workflow_dispatch' && inputs.sqlite_diagnostics
        run: |
          npm install --prefix "$RUNNER_TEMP/makoto-legacy-sqlite" --no-save --package-lock=false sqlite3@5.1.7
          SQLITE3_MODULE="$RUNNER_TEMP/makoto-legacy-sqlite/node_modules/sqlite3" node backend/scripts/sqlite-locking-probe.cjs
