name: Makoto Wallet CI

on:
  push:
    branches: [makoto-wallet]
  pull_request:
    branches: [makoto-wallet]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Brain tests
        run: npm run test:brain --prefix frontend

      - name: Agent tests
        run: npm run test:agent --prefix frontend

      - name: Tasks/auth tests
        run: npm run test:tasks --prefix frontend

      - name: Portfolio tests
        run: npm run test:portfolio --prefix frontend

      - name: UX tests
        run: npm run test:ux --prefix frontend

      - name: Migration tests
        run: npm run test:migration --prefix frontend

      - name: UI tests
        run: npm run test:ui --prefix frontend

      - name: Polish tests
        run: npm run test:polish --prefix frontend

      - name: TypeScript check
        run: npm run type-check --prefix frontend

      - name: ESLint
        run: npm run lint --prefix frontend

      - name: Production build
        env:
          BACKEND_PORT: "3001"
          BASE_PATH: ""
        run: npm run build --prefix frontend

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Backend tests
        run: npm test --prefix backend
